name: Harness drift

# A managed harness file must equal its manifest line (spec 5.4).
# `.github/harness-drift/README.md` owns the rules; this file only runs them.
# No path filter: a pull request that touches nothing managed still passes,
# and one that touches a managed file cannot skip the check by where it edits.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# No concurrency group, for commit-gate.yml's reason: a rerun of an older
# head's run would cancel the newest head's, which then stays there as a
# failed required check that blocks the merge.

jobs:
  harness-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The enforcing copy is read from the base commit, so history is
          # needed (commit-gate.yml's reasoning).
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the proposed gate
        working-directory: .github/harness-drift
        run: python -m unittest

      # The base copy of the gate and of the renderer judge, as in
      # commit-gate.yml, so a pull request cannot supply its own judge. While
      # the base carries no gate (the first sync into a target) the head's
      # copies judge instead, with a notice; a base with a gate but no
      # renderer, or a head with neither, fails.
      - name: Take the enforcing gate from the base commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE: .github/harness-drift/drift_gate.py
          RENDER: .harness/render.py
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/harness-drift"
          mkdir -p "$out"
          if git cat-file -e "$BASE_SHA:$GATE" 2>/dev/null; then
            git show "$BASE_SHA:$GATE" > "$out/drift_gate.py"
            git show "$BASE_SHA:$RENDER" > "$out/render.py"
            echo "enforcing with the gate and renderer as of $BASE_SHA"
          elif [ -f "$GATE" ] && [ -f "$RENDER" ]; then
            cp "$GATE" "$out/drift_gate.py"
            cp "$RENDER" "$out/render.py"
            echo "::notice::the base carries no gate; this pull request introduces it and is judged by its own copy"
          else
            echo "::error::neither $BASE_SHA nor the head carries $GATE and $RENDER"
            exit 1
          fi
          if [ ! -s "$out/drift_gate.py" ] || [ ! -s "$out/render.py" ]; then
            echo "::error::the enforcing gate or renderer is empty"
            exit 1
          fi

      - name: Managed files match the manifest
        shell: bash
        run: |
          python "$RUNNER_TEMP/harness-drift/drift_gate.py" \
            --root . --render "$RUNNER_TEMP/harness-drift/render.py"
