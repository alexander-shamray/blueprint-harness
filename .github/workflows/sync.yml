name: Sync

# A merge to main that changes the payload or the tool opens one sync pull
# request in each target in targets.json, and closes any older one still open
# there (shared-harness spec 5.3). The pull request is the change; nothing is
# pushed to a target's main from here.
on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'harness_sync/**'
  workflow_dispatch:

# The harness repository's contents are only read. Every write to a target goes
# through HARNESS_SYNC_TOKEN: a pull request opened with this workflow's own
# GITHUB_TOKEN would not start the target's required checks, and that holds
# for this repository as a target too (spec 5.1, Self-hosting). The one write
# here, the issue a red run files, is in a job of its own.
permissions:
  contents: read

jobs:
  targets:
    # The drift gate in a target accepts only a commit on harness main, so a
    # dispatch from any other branch would open a pull request bound to fail.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      # The list as main holds it now, as the sync job below reads main's tip.
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: main

      # Every slug is checked before it reaches a matrix, a checkout and a
      # concurrency group, so a malformed line fails here and names itself.
      - name: Read targets.json
        id: read
        timeout-minutes: 1
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0 and all(.[];
                   type == "object" and (.repo | type) == "string"
                   and (.repo | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")))' targets.json > /dev/null ||
            { echo "::error::targets.json must be a non-empty array of {\"repo\": \"owner/name\"}"; exit 1; }
          echo "matrix=$(jq -c . targets.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: targets
    runs-on: ubuntu-latest
    # Past this limit a job reads `cancelled`, which sync-issue does not hear,
    # where a step past its own fails. So every step has one, and together they
    # end first.
    timeout-minutes: 20
    # A pull request from a branch here gets repository secrets and runs that
    # branch's workflows, so the token is a secret of this environment alone,
    # which deploys from main only: no branch's edit to a workflow reaches it
    # (README, The sync workflow).
    environment: harness-sync
    strategy:
      # One target's failure must not leave the others without their sync.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    # One run per target at a time, queued, not cancelled, so no merge cuts in
    # between another's push and its trailer push. The queue does not order
    # runs (GitHub keeps one waiting job per group, and a rerun reuses its old
    # event), so each run syncs main's tip as the job starts, and open-pr
    # refuses a commit older than the target's manifest or an open sync.
    concurrency:
      group: harness-sync-${{ matrix.target.repo }}
      cancel-in-progress: false
    steps:
      # Until the owner stores the token, every target is skipped with a
      # notice and the run stays green, so main stays green (R8).
      - name: Check for HARNESS_SYNC_TOKEN
        id: token
        timeout-minutes: 1
        env:
          TOKEN: ${{ secrets.HARNESS_SYNC_TOKEN }}
          TARGET: ${{ matrix.target.repo }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::HARNESS_SYNC_TOKEN is not set; skipping the sync of $TARGET"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Main's tip, with history: the tip is what is synced, and the history
      # is what open-pr orders commits by. Every git call on it is local.
      - if: steps.token.outputs.present == 'true'
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Full history. The token clones and is not kept, so it is never in
      # target/.git/config while setup-python and later steps run; open-pr's
      # git calls get it from their own step's environment below.
      - if: steps.token.outputs.present == 'true'
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.target.repo }}
          token: ${{ secrets.HARNESS_SYNC_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - if: steps.token.outputs.present == 'true'
        timeout-minutes: 2
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Not `-I`: it drops the working directory from sys.path, and the
      # package is found there. The working directory is this repository at
      # main's tip, not the target, which sits in target/ and is never on the
      # path; `-E -s` still ignore PYTHON* variables and user site (R33).
      - name: Open the sync pull request
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.HARNESS_SYNC_TOKEN }}
          TARGET: ${{ matrix.target.repo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The header checkout would have persisted, set in this step's
          # environment only: git sends it on the target's ls-remote, fetch and
          # pushes, and no file holds it. Its base64 form is masked by hand.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          commit="$(git rev-parse HEAD)"
          python -E -s -m harness_sync open-pr --payload payload --harness . --target target \
            --commit "$commit" --repo "$TARGET" --run-url "$RUN_URL"

  # A red run is an issue, not a notification: a target that failed stays behind
  # the payload with nothing else saying so, and the next red run comments rather
  # than filing again. The title is not `main is red`'s, which stops every landing
  # (README, The sync workflow). `failure()` and not `cancelled`, unlike ci.yml's
  # main-red: a newer run cancels a waiting one here and syncs main's tip itself.
  sync-issue:
    needs: [targets, sync]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time, so two red runs never both see no open issue.
    concurrency:
      group: sync-issue
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: A red sync is an issue, not a notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='A sync run failed, so a target may be behind the payload'
          # A list as long as its limit may be cut, and a listing that cannot see
          # the open issue files a second one, so it is refused.
          list=$(gh issue list --state open --label bug --limit 1000 --json number,title)
          [ "$(jq length <<<"$list")" -lt 1000 ] || { echo "::error::the issue list reached its limit and may be cut"; exit 1; }
          open=$(jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty' <<<"$list")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Red again at $GITHUB_SHA: $RUN_URL"
          else
            printf '%s\n' \
              "A \`Sync\` run did not pass at $GITHUB_SHA: $RUN_URL" \
              '' \
              '## Severity' \
              '' \
              'medium' \
              '' \
              'A target whose job failed may have no finished sync pull request for this' \
              'payload; a rerun of the failed jobs or the next payload merge settles it' \
              '(README.md, *The sync workflow*). This stops no landing. Close this issue' \
              'once a `Sync` run is green.' \
              '' \
              'Filed by the sync-issue job in sync.yml, not by hand or by a sweep.' |
              gh issue create --title "$title" --label bug --label code --label medium --body-file -
          fi
