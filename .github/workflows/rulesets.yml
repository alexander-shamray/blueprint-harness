name: Rulesets

# Reads back every repository's `main` ruleset and compares it with
# `rulesets/main.json` (`README.md`, *Changes*). On a pull request it proves the
# data the branch carries is what is live; on main and daily it catches a
# ruleset changed by hand, and a red scheduled run files an issue.
# No path filter: this is a required check, and a required check that skips
# some pull requests leaves them waiting forever.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Read-only, and no secret: `--effective` reads the rules in force on `main`,
# which any token can read. The one write, the issue, is in a job of its own.
permissions:
  contents: read

jobs:
  # The job id is a required-check context in the `main` ruleset; renaming it
  # makes every pull request wait for a check that never reports.
  rulesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      differences: ${{ steps.check.outputs.differences }}
      status: ${{ steps.check.outputs.status }}
    # Each step has a limit and together they end before the job's, so a step
    # that hangs fails, the plain red, and the job's limit is left to a hang
    # outside a step (README, *The sync workflow*).
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2

      - uses: actions/setup-python@v7
        timeout-minutes: 2
        with:
          python-version: '3.12'

      # The output is data: it goes to a job output through the file command,
      # under a delimiter the text cannot guess, and the exit code is the
      # check's own, so a difference or a refusal still turns the job red.
      - id: check
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          out=$(python -m harness_sync ruleset-check --effective 2>&1) || status=$?
          printf '%s\n' "$out"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            printf 'status=%s\n' "$status"
            printf 'differences<<%s\n' "$delim"
            printf '%s\n' "${out:0:60000}"
            printf '\n%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

  # A scheduled red run is an issue, not a notification: an issue stays open
  # until somebody closes it, and the next red run comments on it rather than
  # filing again (backend's `main-red.yml`). Pull request and push runs are
  # red in the checks and need no issue.
  rulesets-issue:
    needs: rulesets
    # At a job's limit `failure()` and `cancelled()` are both false, so the
    # read-back's own result is read, and `!cancelled()` is false only for a
    # run cancelled whole.
    if: ${{ !cancelled() && github.event_name == 'schedule' && (needs.rulesets.result == 'failure' || needs.rulesets.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time, so two red runs never both see no open issue.
    concurrency:
      group: rulesets-issue
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: A red scheduled read-back is an issue
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIFFERENCES: ${{ needs.rulesets.outputs.differences }}
          STATUS: ${{ needs.rulesets.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="A repository's main ruleset differs from rulesets/main.json, or its read-back failed"
          # A list as long as its limit may be cut, and a listing that cannot see
          # the open issue files a second one, so it is refused.
          LIST=$(gh issue list --state open --label harness --limit 1000 --json number,title)
          [ "$(jq length <<<"$LIST")" -lt 1000 ] || { echo "::error::the issue list reached its limit and may be cut"; exit 1; }
          EXISTING=$(jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' <<<"$LIST")
          # Exit 1 is a difference; anything else (a refusal, a gh failure, a
          # step that never ran) is a read-back that failed.
          if [ "${STATUS:-}" = 1 ]; then WHAT="found differences"; else WHAT="failed (exit status ${STATUS:-unknown})"; fi
          BODY=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            "The scheduled read-back ($RUN_URL) $WHAT:" \
            "${DIFFERENCES:-no output reached this job; see the run}" \
            "Severity: high")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label bug --label harness --label high --body "$BODY

          Filed by \`.github/workflows/rulesets.yml\`. Each further red scheduled run comments here rather than filing again; close this issue once \`ruleset-check --effective\` exits 0."
          fi
