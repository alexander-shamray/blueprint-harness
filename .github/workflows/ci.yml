name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Read-only: the jobs test the tree and write nothing back.
permissions:
  contents: read

concurrency:
  # On main each commit has a group of its own, so a later push cannot cancel
  # the run of an earlier one. A rerun has one too, so rerunning a stale head
  # cannot cancel the required check of a newer head on the same ref.
  group: >-
    ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}${{
    github.run_attempt != '1' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The job id is the required-check context in the `main` ruleset; renaming it
  # makes every pull request wait for a check that never reports.
  sync-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python -m unittest discover -s harness_sync/tests -t .

      - run: python -m unittest discover -s measure -t .

  # The payload's own suites, run where a target runs them: in a worktree of
  # this commit with the payload applied over it under backend's draft config,
  # from the worktree root (shared-harness spec 5.1, *Tests*). The payload is
  # not live here, so this is the only place its tests run before a sync
  # carries it into a target.
  #
  # Linux runs everything, as backend's `review-helpers` job does. Windows and
  # macOS run only the edit-target guard, the index hook and the sed
  # line-ending guard, mirroring backend's `edit-target-guard` job and on its
  # argument: those modules have branches no Linux runner reaches (junctions,
  # `..` after a link, case folding, `msvcrt.locking`, the guard judging on
  # Windows alone) and need nothing but Python and `git`, where the rest of
  # the directory needs `bash`, `grep` and `jq` on PATH as well. Those legs
  # still apply the payload on every run, so a pull request that reaches
  # nothing they test reports the required check without spending a test step.
  payload-suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        # Git's bash on Windows, so the one script below serves all three.
        shell: bash
    steps:
      # Depth 2 keeps the merge commit's parents, which the decision compares.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `harness_sync/legs.py` owns the rule and what reaches these legs.
      - name: Decide whether this leg tests
        id: reach
        if: matrix.os != 'ubuntu-latest'
        run: python -m harness_sync legs --event "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"

      # The config is copied in rather than passed, so apply reads it from the
      # path every target keeps it at.
      - name: Apply the payload to a worktree of this commit
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/rendered"
          git worktree add --detach "$rendered" HEAD
          mkdir -p "$rendered/.harness"
          cp targets/blueprint-backend.config.json "$rendered/.harness/config.json"
          python -m harness_sync apply --payload payload --target "$rendered" --commit "$(git rev-parse HEAD)"

      - name: Test the review helpers
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}/rendered
        run: python -m unittest discover -s .claude/scripts

      # Every gate directory the payload ships a suite for, read from the
      # rendered tree rather than listed, so a gate added to the payload is
      # tested from its first pull request. Each runs from its own directory,
      # as backend's workflows run it.
      - name: Test the gates
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}/rendered
        run: |
          set -uo pipefail
          ran=0 failed=0
          for dir in .github/*/; do
            compgen -G "${dir}test_*.py" > /dev/null || continue
            echo "::group::${dir%/}"
            (cd "$dir" && python -m unittest) || failed=1
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          # A loop that found nothing would pass; the payload ships gate suites.
          if [ "$ran" -eq 0 ]; then echo "no gate suite found under .github/" >&2; exit 1; fi
          exit "$failed"

      # `-v` for the lines the modules print: which link primitive was reached
      # and which lock branch was chosen are why these legs exist.
      - name: Test the edit-target guard
        if: matrix.os != 'ubuntu-latest' && steps.reach.outputs.test != 'false'
        working-directory: ${{ runner.temp }}/rendered
        run: python -m unittest discover -s .claude/scripts -p "test_edit_target_guard.py" -v

      - name: Test the index hook
        if: matrix.os != 'ubuntu-latest' && steps.reach.outputs.test != 'false'
        working-directory: ${{ runner.temp }}/rendered
        run: python -m unittest discover -s .claude/scripts -p "test_refresh_index.py" -v

      - name: Test the sed line-ending guard
        if: matrix.os != 'ubuntu-latest' && steps.reach.outputs.test != 'false'
        working-directory: ${{ runner.temp }}/rendered
        run: python -m unittest discover -s .claude/scripts -p "test_sed_crlf_guard.py" -v
