name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Read-only: the jobs test the tree and write nothing back. `main-red`, which reads no tree, opens or comments on an issue.
permissions:
  contents: read

concurrency:
  # On main each commit has a group of its own, so a later push cannot cancel
  # the run of an earlier one. A rerun has one too, so rerunning a stale head
  # cannot cancel the required check of a newer head on the same ref.
  group: >-
    ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}${{
    github.run_attempt != '1' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The job id is the required-check context in the `main` ruleset; renaming it
  # makes every pull request wait for a check that never reports.
  sync-tool:
    runs-on: ubuntu-latest
    # Read only still: the issue-form gate below lists the repository's labels.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python -m unittest discover -s harness_sync/tests -t .

      - run: python -m unittest discover -s measure -t .

      # From the payload: the rendered root's copy is a sync behind this commit.
      - name: Every issue-form choice is its owner's word and a label here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name |
            python payload/.github/issue-form-gate/issue_form_gate.py

  # The payload's own suites, run where a target runs them: in a worktree of
  # this commit with the payload applied over it under backend's draft config,
  # from the worktree root (shared-harness spec 5.1, *Tests*). The payload is
  # not live here, so this is the only place its tests run before a sync
  # carries it into a target.

  # Every leg runs the whole `.claude/scripts` suite, so a helper that fails on one host is this repository's red
  # before it is a target's: frontend's first whole run of it off Linux failed 132 cases on macOS and 10 on Windows.
  # The gates run on Linux alone, as backend's workflows run them, and Windows adds the comment gate's suite
  # for its fixture. Git's bash runs the steps on Windows, so the one script below serves all three.
  payload-suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows takes about sixteen minutes over the whole helpers suite, which twenty left no room above.
    timeout-minutes: 45
    defaults:
      run:
        # Git's bash on Windows, so the one script below serves all three.
        shell: bash
    steps:
      # Depth 2 keeps the merge commit's parents, which the decision compares.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `harness_sync/legs.py` owns the rule and what reaches these legs. They
      # still apply the payload on every run, so a pull request that reaches
      # nothing they test reports the required check with its test steps skipped.
      - name: Decide whether this leg tests
        id: reach
        if: matrix.os != 'ubuntu-latest'
        run: python -m harness_sync legs --event "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"

      # The config is copied in rather than passed, so apply reads it from the
      # path every target keeps it at.
      - name: Apply the payload to a worktree of this commit
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/rendered"
          git worktree add --detach "$rendered" HEAD
          mkdir -p "$rendered/.harness"
          cp targets/blueprint-backend.config.json "$rendered/.harness/config.json"
          python -m harness_sync apply --payload payload --target "$rendered" --commit "$(git rev-parse HEAD)"

      # `-v` and the version line for what the modules print: which link primitive was reached, which lock branch
      # was chosen, and which bash read the helpers, since macOS's is 3.2. Ubuntu runs the suite through the shard
      # runner every target is handed, so a class it stops placing or running is red here first.
      - name: Test the review helpers
        if: matrix.os == 'ubuntu-latest' || steps.reach.outputs.test != 'false'
        working-directory: ${{ runner.temp }}/rendered
        run: |
          bash --version | head -n 1
          if [ "$RUNNER_OS" = Linux ]; then
            python .claude/scripts/shard-harness-suite.py
          else
            python -m unittest discover -s .claude/scripts -v
          fi

      # Every gate directory the payload ships a suite for, read from the
      # rendered tree rather than listed, so a gate added to the payload is
      # tested from its first pull request. Each runs from its own directory,
      # as backend's workflows run it.
      - name: Test the gates
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}/rendered
        run: |
          set -uo pipefail
          ran=0 failed=0
          for dir in .github/*/; do
            compgen -G "${dir}test_*.py" > /dev/null || continue
            echo "::group::${dir%/}"
            (cd "$dir" && python -m unittest) || failed=1
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          # A loop that found nothing would pass; the payload ships gate suites.
          if [ "$ran" -eq 0 ]; then echo "no gate suite found under .github/" >&2; exit 1; fi
          exit "$failed"

      # Windows alone, for its fixture rather than its subject: a cleanup meeting git's read-only objects fails
      # nowhere else, and the suite builds its own tree rather than reading `review_helpers.temp_root`'s.
      - name: Test the comment gate's fixture
        if: matrix.os == 'windows-latest' && steps.reach.outputs.test != 'false'
        working-directory: ${{ runner.temp }}/rendered
        run: python -m unittest discover -s .github/comment-gate -p "test_comment_gate.py" -v

  # A red push run is an issue, which outlives the run and is what `/ship` step 6 reads through `main-red-open.sh`.
  # A job that hits its timeout or that no runner picks up reports `cancelled`, and `failure()` is false for that.
  # The concurrency block above cancels nothing on `main`, so the one false alarm is somebody's own cancel.
  # `harness_sync/tests/test_main_red_job.py` holds `needs` to every other job here.
  main-red:
    needs: [sync-tool, payload-suites]
    if: >-
      always() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time, so two red runs never both see no open issue.
    concurrency:
      group: main-red
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: A red main is an issue, not a notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='main is red: ci'
          # A list as long as its limit may be cut, and a listing that cannot see
          # the open issue files a second one, so it is refused.
          list=$(gh issue list --state open --label bug --limit 1000 --json number,title)
          [ "$(jq length <<<"$list")" -lt 1000 ] || { echo "::error::the issue list reached its limit and may be cut"; exit 1; }
          open=$(jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty' <<<"$list")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Red again at $GITHUB_SHA: $RUN_URL"
          else
            printf '%s\n' \
              "The \`CI\` run on a push to \`main\` did not pass at $GITHUB_SHA: $RUN_URL" \
              '' \
              '## Severity' \
              '' \
              'high' \
              '' \
              'Revert the pull request that turned it red first, then fix forward' \
              '(docs/harness/working-rules.md, *CI*). While this is open, `/ship` step 6' \
              'lands only a run started for this issue. Close it once main is green.' \
              '' \
              'Filed by the main-red job in ci.yml, not by hand or by a sweep.' |
              gh issue create --title "$title" --label bug --label harness --label high --body-file -
          fi
